name: CI

on:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test

      - name: Check hooks feature
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --features hooks --lib

      - name: Run LD_PRELOAD smoke test
        if: matrix.os == 'ubuntu-latest'
        run: bash tests/preload_smoke.sh
